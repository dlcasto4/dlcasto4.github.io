<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rammerhead</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }
    #rammerhead-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      flex-direction: column;
    }
    #rammerhead-proxy {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      background: #181818;
      overflow: auto;
      border: none;
      box-shadow: 0 0 16px #111;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 1.6em;
      color: #bbb;
      background: #181818;
    }
    .error {
      color: #ff6a6a;
      padding: 2em;
      font-size: 1.2em;
      background: #2c1515;
    }
  </style>
</head>
<body>
  <div id="rammerhead-container">
    <div id="rammerhead-proxy" class="loading">
      Loading Rammerhead Proxy...
    </div>
  </div>
  <script>
    // Dynamically load Rammerhead in an iframe from the backend proxy
    const proxyDiv = document.getElementById('rammerhead-proxy');
    function loadRammerhead() {
      const iframe = document.createElement('iframe');
      iframe.src = '/rh?url=https://browser.rammerhead.org';
      iframe.id = 'rammerhead-iframe';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allow = 'clipboard-read; clipboard-write; microphone; camera; display-capture; fullscreen; geolocation; midi; encrypted-media; autoplay';
      iframe.onload = () => {
        proxyDiv.classList.remove('loading');
      };
      iframe.onerror = () => {
        proxyDiv.innerHTML = '<div class="error">Failed to load Rammerhead Proxy.</div>';
      };
      proxyDiv.innerHTML = '';
      proxyDiv.appendChild(iframe);
    }

    window.addEventListener('DOMContentLoaded', loadRammerhead);
  </script>
</body>
</html>
