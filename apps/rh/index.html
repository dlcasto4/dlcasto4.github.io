<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rammerhead</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }
    #rammerhead-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      flex-direction: column;
    }
    #rammerhead-proxy {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      background: #181818;
      overflow: auto;
      border: none;
      box-shadow: 0 0 16px #111;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 1.6em;
      color: #bbb;
      background: #181818;
    }
    .error {
      color: #ff6a6a;
      padding: 2em;
      font-size: 1.2em;
      background: #2c1515;
    }
  </style>
</head>
<body>
  <div id="rammerhead-container">
    <div id="rammerhead-proxy" class="loading">
      Loading Rammerhead Proxy...
    </div>
  </div>
  <script>
    // Fetch the proxied Rammerhead browser and inject into the div
// External Backend Proxy for browser.rammerhead.org
// Run: npm install express node-fetch cors
// Start: node proxy-server.js

const express = require('express');
const fetch = require('node-fetch');
const cors = require('cors');

const app = express();
const PORT = process.env.PORT || 3000;

// Allow all origins (Configure in production for security)
app.use(cors());

// Proxy any GET request to browser.rammerhead.org
app.get('/rh', async (req, res) => {
  try {
    const targetUrl = req.query.url || 'https://browser.rammerhead.org';
    // Optional: Validate URL to restrict open proxy use
    if (!/^https:\/\/browser\.rammerhead\.org/.test(targetUrl)) {
      return res.status(400).send('Invalid target URL');
    }

    const response = await fetch(targetUrl, {
      headers: { 'User-Agent': req.get('User-Agent') || '' }
    });

    // Forward status and headers (optional: filter for safety)
    res.status(response.status);
    response.headers.forEach((v, k) => res.setHeader(k, v));
    const body = await response.buffer();
    res.send(body);
  } catch (err) {
    res.status(500).send('Proxy error: ' + err.message);
  }
});

app.listen(PORT, () => {
  console.log(`External backend proxy running on http://localhost:${PORT}/proxy`);
  console.log(`Example: http://localhost:${PORT}/proxy?url=https://browser.rammerhead.org`);
});
  </script>
</body>
</html>
