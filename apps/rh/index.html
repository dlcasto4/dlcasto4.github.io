<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rammerhead Proxy Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }
    #rammerhead-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      flex-direction: column;
    }
    #rammerhead-proxy {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      background: #181818;
      overflow: auto;
      border: none;
      box-shadow: 0 0 16px #111;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 1.6em;
      color: #bbb;
      background: #181818;
    }
    .error {
      color: #ff6a6a;
      padding: 2em;
      font-size: 1.2em;
      background: #2c1515;
    }
  </style>
</head>
<body>
  <div id="rammerhead-container">
    <div id="rammerhead-proxy" class="loading">
      Loading Rammerhead Proxy...
    </div>
  </div>
  <script>
    // Fetch the proxied Rammerhead browser and inject into the div
    fetch('http://localhost:3000/proxy?url=https://browser.rammerhead.org')
      .then(response => {
        if (!response.ok) throw new Error("Proxy error: " + response.status + " " + response.statusText);
        return response.text();
      })
      .then(html => {
        const container = document.getElementById('rammerhead-proxy');
        container.classList.remove('loading');
        container.innerHTML = html;
      })
      .catch(e => {
        const container = document.getElementById('rammerhead-proxy');
        container.classList.remove('loading');
        container.classList.add('error');
        container.textContent = "Failed to load Rammerhead Proxy: " + e.message;
      });
  </script>
</body>
</html>
